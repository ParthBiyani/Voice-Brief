[project]
name = "voicebrief"
version = "0.1.0"
description = "A personalized daily audio brief that knows what you're building."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # Kept within one minor of the server image in docker-compose.yml; a wider
    # gap makes the client warn and risks wire-format drift.
    "qdrant-client>=1.12,<1.14",
    "boto3>=1.35",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3",
    # HDBSCAN ships inside scikit-learn >= 1.3; the standalone package needs a C
    # toolchain on Windows for no benefit.
    "scikit-learn>=1.5",
    "numpy>=1.26,<3",
]
llm = [
    "anthropic>=0.40",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.25",
]
docs = [
    "pymupdf>=1.24",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
]
tts = [
    "kokoro>=0.9",
    "soundfile>=0.12",
    "pydub>=0.25",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
]

[project.scripts]
voicebrief = "voicebrief.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebrief"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires docker-compose services",
    "network: hits live third-party APIs",
    "slow: model downloads or long-running",
]
