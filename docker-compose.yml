# Host ports are deliberately non-default so VoiceBrief coexists with other local
# stacks (a native Postgres on 5432, etc.), and every one is published on 127.0.0.1 only:
# these stores have simple credentials and, on a laptop joining public Wi-Fi, must not be
# reachable from the network. Credentials can be changed with VB_PG_PASSWORD and
# VB_S3_SECRET_KEY (set the same values in .env for the app). Postgres and MinIO read them only when
# their volume is first created; changing them later means changing them inside the store.
name: voicebrief

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicebrief
      POSTGRES_PASSWORD: ${VB_PG_PASSWORD:-voicebrief}
      POSTGRES_DB: voicebrief
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicebrief -d voicebrief"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    # Pinned, and the client range in pyproject is pinned to match. Qdrant storage
    # is not forward-compatible: 1.19 refuses to read segments written by 1.12
    # ("unknown variant `on_disk`"), so bumping this image is a migration, not a
    # version bump. Change both together or neither.
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports: ["127.0.0.1:56333:6333", "127.0.0.1:56334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # The upstream minio/minio images are no longer published to Docker Hub or Quay.
    # This community-maintained mirror serves the same S3 API and keeps local dev working.
    image: bitnamilegacy/minio:2024.11.7
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: voicebrief
      MINIO_ROOT_PASSWORD: ${VB_S3_SECRET_KEY:-voicebrief}
      MINIO_DEFAULT_BUCKETS: voicebrief-media
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["miniodata:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
  miniodata:
