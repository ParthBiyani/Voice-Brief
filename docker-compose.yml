# Host ports are deliberately non-default so VoiceBrief coexists with other local
# stacks (a native Postgres on 5432, another project's Redis, etc.).
name: voicebrief

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voicebrief
      POSTGRES_PASSWORD: voicebrief
      POSTGRES_DB: voicebrief
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicebrief -d voicebrief"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    # Pinned, and the client range in pyproject is pinned to match. Qdrant storage
    # is not forward-compatible: 1.19 refuses to read segments written by 1.12
    # ("unknown variant `on_disk`"), so bumping this image is a migration, not a
    # version bump. Change both together or neither.
    image: qdrant/qdrant:v1.12.4
    ports: ["56333:6333", "56334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # The upstream minio/minio images are no longer published to Docker Hub or Quay.
    # This community-maintained mirror serves the same S3 API and keeps local dev working.
    image: bitnamilegacy/minio:2024.11.7
    environment:
      MINIO_ROOT_USER: voicebrief
      MINIO_ROOT_PASSWORD: voicebrief
      MINIO_DEFAULT_BUCKETS: voicebrief-media
    ports: ["59000:9000", "59001:9001"]
    volumes: ["miniodata:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  miniodata:
