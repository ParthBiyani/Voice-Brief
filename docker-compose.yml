# Host ports are deliberately non-default so VoiceBrief coexists with other local
# stacks (a native Postgres on 5432, another project's Redis, etc.).
name: voicebrief

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voicebrief
      POSTGRES_PASSWORD: voicebrief
      POSTGRES_DB: voicebrief
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicebrief -d voicebrief"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["56333:6333", "56334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: voicebrief
      MINIO_ROOT_PASSWORD: voicebrief
    ports: ["59000:9000", "59001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  miniodata:
